<div class="rewrite-extension-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Rewrite Extension</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="rewrite-extension_block flex-container">
                <label for="rewrite_extension_model_select">Configure Model:</label>
                <span class="tooltip-icon fa-solid fa-circle-question" data-tooltip="Choose which Completion type to configure. For Chat Completion this affects if presets or templates are used."></span>
                <select id="rewrite_extension_model_select" class="text_pole">
                    <option value="chat_completion">Chat Completion</option>
                    <option value="textgenerationwebui">Text Completion/NovelAI</option>
                </select>
            </div>

            <div class="rewrite-extension_block">
                <b>Options</b>
                <div class="flex-container" style="margin-top: 8px; gap: 8px;">
                    <input type="checkbox" id="show_rewrite" class="checkbox" checked>
                    <label for="rewrite_label" style="min-width: 90px;">Rewrite</label>
                    <input type="text" id="rewrite_label" class="text_pole" placeholder="Button name">
                </div>
                <div class="flex-container" style="margin-top: 8px; gap: 8px;">
                    <input type="checkbox" id="show_shorten" class="checkbox" checked>
                    <label for="shorten_label" style="min-width: 90px;">Shorten</label>
                    <input type="text" id="shorten_label" class="text_pole" placeholder="Button name">
                </div>
                <div class="flex-container" style="margin-top: 8px; gap: 8px;">
                    <input type="checkbox" id="show_expand" class="checkbox" checked>
                    <label for="expand_label" style="min-width: 90px;">Expand</label>
                    <input type="text" id="expand_label" class="text_pole" placeholder="Button name">
                </div>
                <div class="flex-container" style="margin-top: 8px; gap: 8px;">
                    <input type="checkbox" id="show_custom" class="checkbox" checked>
                    <label for="custom_label" style="min-width: 90px;">Custom</label>
                    <input type="text" id="custom_label" class="text_pole" placeholder="Button name">
                </div>
                <div class="flex-container" style="margin-top: 8px; gap: 8px;">
                    <input type="checkbox" id="show_delete" class="checkbox" checked>
                    <label for="delete_label" style="min-width: 90px;">Delete</label>
                    <input type="text" id="delete_label" class="text_pole" placeholder="Button name">
                </div>
            </div>

            <hr class="sysHR" />

            <div id="chat_completion_settings" class="model-specific-settings">
                <div class="rewrite-extension_block flex-container" style="gap:8px;">
                    <label for="rewrite_preset" style="min-width:90px;">Rewrite Preset</label>
                    <select id="rewrite_preset" class="text_pole"></select>
                </div>
                <div class="rewrite-extension_block flex-container" style="gap:8px;">
                    <label for="shorten_preset" style="min-width:90px;">Shorten Preset</label>
                    <select id="shorten_preset" class="text_pole"></select>
                </div>
                <div class="rewrite-extension_block flex-container" style="gap:8px;">
                    <label for="expand_preset" style="min-width:90px;">Expand Preset</label>
                    <select id="expand_preset" class="text_pole"></select>
                </div>
                <div class="rewrite-extension_block flex-container" style="gap:8px;">
                    <label for="custom_preset" style="min-width:90px;">Custom Preset</label>
                    <select id="custom_preset" class="text_pole"></select>
                </div>

                <div class="rewrite-extension_block flex-container checkbox-container">
                    <div class="checkbox-label-group">
                        <input type="checkbox" id="override_max_tokens" class="checkbox" checked>
                        <label for="override_max_tokens">Override Preset Max Tokens</label>
                    </div>
                </div>
            </div>

            <div id="text_based_settings" class="model-specific-settings" style="display: none;">
                <div class="rewrite-extension_block flex-container" style="gap:8px; align-items:flex-start;">
                    <label for="text_rewrite_prompt" style="min-width:90px;">Rewrite Prompt</label>
                    <textarea id="text_rewrite_prompt" class="text_pole" rows="3" placeholder="Rewrite prompt"></textarea>
                </div>
                <div class="rewrite-extension_block flex-container" style="gap:8px; align-items:flex-start;">
                    <label for="text_shorten_prompt" style="min-width:90px;">Shorten Prompt</label>
                    <textarea id="text_shorten_prompt" class="text_pole" rows="3" placeholder="Shorten prompt"></textarea>
                </div>
                <div class="rewrite-extension_block flex-container" style="gap:8px; align-items:flex-start;">
                    <label for="text_expand_prompt" style="min-width:90px;">Expand Prompt</label>
                    <textarea id="text_expand_prompt" class="text_pole" rows="3" placeholder="Expand prompt"></textarea>
                </div>
                <div class="rewrite-extension_block flex-container" style="gap:8px; align-items:flex-start;">
                    <label for="text_custom_prompt" style="min-width:90px;">Custom Prompt</label>
                    <textarea id="text_custom_prompt" class="text_pole" rows="3" placeholder="Custom prompt (use {{custom_instructions}})"></textarea>
                </div>
            </div>

            <hr class="sysHR" />

            <div class="rewrite-extension_block flex-container checkbox-container">
                <div class="checkbox-label-group">
                    <input type="checkbox" id="use_streaming" class="checkbox">
                    <label for="use_streaming">Use Streaming</label>
                </div>
            </div>

            <div class="rewrite-extension_block flex-container checkbox-container">
                <div class="checkbox-label-group">
                    <input type="checkbox" id="apply_regex_on_rewrite" class="checkbox">
                    <label for="apply_regex_on_rewrite">Apply Regex on Rewrite</label>
                </div>
            </div>

            <div class="rewrite-extension_block flex-container">
                <label>Dynamic Token Mode:</label>
                <input type="text" class="text_pole" value="Multiplicative x5" disabled>
            </div>
        </div>
    </div>
</div>
